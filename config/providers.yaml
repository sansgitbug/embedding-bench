# Model IDs, prices and limits below were checked on the date in `checked`,
# from the URLs under each run's `sources`. Prices are LIST prices in USD per
# 1M input tokens; `price_source` says exactly where each came from.
# Costs in results/ are always measured tokens x list price, even where the
# account used for the run paid nothing (free tiers and trial keys).
checked: "2026-11-14"
top_k: 5

# Each entry under `runs` becomes one row in results/summary.md.
# index_model embeds the chunks, query_model embeds the queries.
#
# limits   (the harness waits):  rpm = requests/min, tpm = tokens/min,
#                                ipm = input texts/min. null = no cap.
# budgets  (the harness stops):  max_calls_per_month, token_budget. Checked
#                                before a run starts and before every call;
#                                usage is kept in cache/<adapter>.ledger.json.
# max_attempts: total tries per call on 429/5xx (so 3 = at most 2 retries).
runs:
  local-bge-m3:
    adapter: local
    label: "Local: BAAI/bge-m3 (long context)"
    index_model: BAAI/bge-m3
    query_model: BAAI/bge-m3
    max_input_tokens: 8192
    index_price_per_1m: 0.0
    query_price_per_1m: 0.0
    price_source: "free (open weights, MIT licence, run on the test machine)"
    batch_texts: 8
    limits: {rpm: null, tpm: null, ipm: null}
    sources:
      - https://huggingface.co/BAAI/bge-m3

  local-minilm:
    adapter: local
    label: "Local: all-MiniLM-L6-v2 (truncates at 256 tokens)"
    index_model: sentence-transformers/all-MiniLM-L6-v2
    query_model: sentence-transformers/all-MiniLM-L6-v2
    max_input_tokens: 256
    index_price_per_1m: 0.0
    query_price_per_1m: 0.0
    price_source: "free (open weights, Apache-2.0 licence, run on the test machine)"
    batch_texts: 32
    limits: {rpm: null, tpm: null, ipm: null}
    sources:
      - https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2

  cohere-pro:
    adapter: cohere
    label: "Cohere: embed-v5.0-pro (index and query)"
    index_model: embed-v5.0-pro
    query_model: embed-v5.0-pro
    max_input_tokens: 128000
    index_price_per_1m: 0.12
    query_price_per_1m: 0.12
    price_source: "Cohere Embed 5 launch post, 2026-09-30 (cohere.com/pricing lists no per-token Embed price)"
    batch_texts: 96              # documented max texts per call; fewer calls = less trial quota
    # Docs: trial keys 2,000 inputs/min on Embed and 1,000 API calls a month.
    # tpm 100,000: stated in the API's own 429 response to the trial key on
    # 2026-11-14 ("trial token rate limit exceeded, limit is 100000 tokens per
    # minute"); the rate-limits page does not list it.
    limits: {rpm: null, tpm: 100000, ipm: 2000}
    max_calls_per_month: 1000    # shared by both Cohere rows (same key, same ledger)
    max_attempts: 2
    sources:
      - https://docs.cohere.com/docs/cohere-embed
      - https://cohere.com/blog/embed-5
      - https://docs.cohere.com/docs/rate-limits
      - https://docs.cohere.com/reference/embed

  cohere-pro-fast:
    adapter: cohere
    label: "Cohere: embed-v5.0-pro index + embed-v5.0-fast query (Cohere's recommended setup)"
    index_model: embed-v5.0-pro  # reuses cohere-pro's cached chunk embeddings
    query_model: embed-v5.0-fast
    max_input_tokens: 128000
    index_price_per_1m: 0.12
    query_price_per_1m: 0.08
    price_source: "Cohere Embed 5 launch post, 2026-09-30 (cohere.com/pricing lists no per-token Embed price)"
    batch_texts: 96
    # tpm 100,000: stated in the API's own 429 response to the trial key on
    # 2026-11-14 ("trial token rate limit exceeded, limit is 100000 tokens per
    # minute"); the rate-limits page does not list it.
    limits: {rpm: null, tpm: 100000, ipm: 2000}
    max_calls_per_month: 1000
    max_attempts: 2
    sources:
      - https://docs.cohere.com/docs/cohere-embed
      - https://cohere.com/blog/embed-5

  voyage-4-large:
    adapter: voyage
    label: "Voyage: voyage-4-large"
    index_model: voyage-4-large
    query_model: voyage-4-large
    max_input_tokens: 32000
    index_price_per_1m: 0.12
    query_price_per_1m: 0.12
    price_source: "docs.voyageai.com/docs/pricing"
    batch_texts: 16
    # Docs give 2,000 RPM / 3M TPM only for accounts WITH a payment method and
    # state no figure for accounts without one. 3 RPM / 10K TPM is the account
    # owner's cautious setting for a key with no card on file.
    limits: {rpm: 3, tpm: 10000, ipm: null}
    max_attempts: 3
    sources:
      - https://docs.voyageai.com/docs/embeddings
      - https://docs.voyageai.com/docs/pricing
      - https://docs.voyageai.com/docs/rate-limits
      - https://docs.voyageai.com/reference/embeddings-api

  jina-v5-small:
    adapter: jina
    label: "Jina: jina-embeddings-v5-text-small"
    index_model: jina-embeddings-v5-text-small
    query_model: jina-embeddings-v5-text-small
    max_input_tokens: 32768
    index_price_per_1m: 0.05
    query_price_per_1m: 0.05
    price_source: >-
      UNVERIFIED: $50 per 1B-token top-up as quoted from jina.ai/reader by a web search;
      no Jina page fetched on the check date showed a price
    batch_texts: 64
    # jina.ai/embeddings: free key 100 RPM and 100,000 TPM. jina.ai/reader:
    # "Every new API key comes with 10M free tokens".
    limits: {rpm: 100, tpm: 100000, ipm: null}
    token_budget: 10000000
    max_attempts: 3
    sources:
      - https://jina.ai/embeddings/
      - https://jina.ai/models/jina-embeddings-v5-text-small/
      - https://jina.ai/api-dashboard/pricing/
      - https://jina.ai/reader/
